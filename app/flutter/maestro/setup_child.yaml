appId: quest.yarnia.yarnia
---
# Subflow: create a new child profile from the onboarding screen.
# After this flow completes, the app is on the GreetingScreen.

- tapOn:
    text: "e.g. Mira"
- inputText: "Mira"
# Dismiss keyboard before tapping age buttons
- hideKeyboard

- tapOn:
    text: "5"

- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
    timeout: 8000
    speed: 20

- tapOn:
    text: "Continue"

- waitForAnimationToEnd:
    timeout: 5000
