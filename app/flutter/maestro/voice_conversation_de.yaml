appId: quest.yarnia.yarnia
---
# Full German voice conversation flow.
# Build with German: flutter build apk --dart-define=APP_LANGUAGE=de
#
# Run: maestro test maestro/voice_conversation_de.yaml --device 53111FDAP004SA

- launchApp

- runFlow:
    file: navigate_to_story.yaml

- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    text: "oder hier tippen…"
- inputText: "Ich will heute Abend zum Mond fliegen"
- pressKey: Enter

- waitForAnimationToEnd:
    timeout: 20000

- tapOn:
    text: "oder hier tippen…"
- inputText: "Ja, das klingt toll"
- pressKey: Enter

- waitForAnimationToEnd:
    timeout: 30000
