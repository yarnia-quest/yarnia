appId: quest.yarnia.yarnia
---
# Full voice conversation flow (German)
#
# Build with German locale override:
#   flutter build apk --dart-define-from-file=dart_defines/local.json --dart-define=APP_LANGUAGE=de
# Run:
#   maestro test maestro/voice_conversation_de.yaml

- launchApp:
    clearState: true

- waitForAnimationToEnd:
    timeout: 8000

# German text hint
- tapOn:
    text: "oder hier tippen…"
- inputText: "Ich will heute Abend zum Mond fliegen"
- pressKey: Enter

- waitForAnimationToEnd:
    timeout: 15000

- tapOn:
    text: "oder hier tippen…"
- inputText: "Ja, das klingt toll"
- pressKey: Enter

- waitForAnimationToEnd:
    timeout: 25000
