appId: quest.yarnia.yarnia
---
# German voice conversation flow. Works against EN or DE build.
# Run: just maestro-de

- launchApp

- runFlow:
    file: navigate_to_story.yaml

# Wait for the agent conversation to start
- waitForAnimationToEnd:
    timeout: 15000

# Text field hint is "oder hier tippen…" (DE build) or "or type here…" (EN build)
- assertVisible:
    text: "or type here…"

- tapOn:
    text: "or type here…"
- inputText: "Ich will heute Abend zum Mond fliegen"
- pressKey: Enter

- waitForAnimationToEnd:
    timeout: 20000

# Optional follow-up turn
- runFlow:
    when:
      visible:
        text: "or type here…"
    commands:
      - tapOn:
          text: "or type here…"
      - inputText: "Ja, das klingt toll"
      - pressKey: Enter
      - waitForAnimationToEnd:
          timeout: 30000
