appId: quest.yarnia.yarnia
---
# Full English voice conversation flow: launch → navigate → converse → story narrates.
# Handles fresh install, ProfilePicker, and returning single-user starts.
#
# Run (USB):  just maestro-en
# Run (WiFi): just maestro-en device=pixie:5555

- launchApp

- runFlow:
    file: navigate_to_story.yaml

# ── First conversation turn ───────────────────────────────────────────
- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    text: "or type here…"
- inputText: "I want a story about rabbits"
- pressKey: Enter

# Wait for agent response — may go READY immediately (story starts) or
# ask a follow-up question (text field stays visible)
- waitForAnimationToEnd:
    timeout: 20000

# ── Optional second turn (agent asked a follow-up) ────────────────────
- runFlow:
    when:
      visible:
        text: "or type here…"
    commands:
      - tapOn:
          text: "or type here…"
      - inputText: "Yes please, let's start"
      - pressKey: Enter
      - waitForAnimationToEnd:
          timeout: 30000
