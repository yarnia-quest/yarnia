appId: quest.yarnia.yarnia
---
# Full English voice conversation flow: launch → navigate to story → converse → story plays.
# Handles fresh install, profile picker, and returning single-user starts.
#
# Run (USB):  maestro test maestro/voice_conversation_en.yaml --device 53111FDAP004SA
# Run (WiFi): maestro test maestro/voice_conversation_en.yaml --device pixie:5555

- launchApp

- runFlow:
    file: navigate_to_story.yaml

# ── Conversation: type into the always-visible text fallback ──────────
- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    text: "or type here…"
- inputText: "I want a story about rabbits"
- pressKey: Enter

# Wait for agent response (cloud ~3s; local fallback ~10s)
- waitForAnimationToEnd:
    timeout: 20000

# Confirm the story choice
- tapOn:
    text: "or type here…"
- inputText: "Yes please, let's start"
- pressKey: Enter

# Wait for story generation + first sentence narrating
- waitForAnimationToEnd:
    timeout: 30000
