appId: quest.yarnia.yarnia
---
# Full English voice conversation flow: launch → navigate → agent converse → story narrates.
# Handles fresh install, ProfilePicker, and returning single-user starts.
#
# Run (USB):  just maestro-en
# Run (WiFi): just maestro-en device=pixie:5555

- launchApp

- runFlow:
    file: navigate_to_story.yaml

# ── Wait for the agent conversation to start ─────────────────────────
# The greeting TTS plays first; _startConversation() fires after it finishes.
# The text field "or type here…" appears once the app is in listening state
# and ready for the first conversation turn.
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible:
    text: "or type here…"

# ── First conversation turn ───────────────────────────────────────────
- tapOn:
    text: "or type here…"
- inputText: "I want a story about rabbits"
- pressKey: Enter

# Wait for agent response — may go READY immediately or ask a follow-up
- waitForAnimationToEnd:
    timeout: 20000

# ── Optional second turn (agent asked a follow-up) ────────────────────
- runFlow:
    when:
      visible:
        text: "or type here…"
    commands:
      - tapOn:
          text: "or type here…"
      - inputText: "Yes please, let's start"
      - pressKey: Enter
      - waitForAnimationToEnd:
          timeout: 30000
